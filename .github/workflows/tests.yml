name: Test candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt -r tests_ha/requirements.txt
      - run: python -W error::ResourceWarning tools/test_without_build.py
      - run: python -m pytest tests_ha/test_integration.py -q
      - run: python tools/check_docs.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - run: npm test --prefix tests
        env:
          SIB_SCREENSHOTS: ${{ runner.temp }}/sib-ui
